id: jinja-007
famille: fonctionnalite
depot: jinja
fichier_decisif: src/jinja2/filters.py
consigne: >-
  Ajoute au filtre center un paramètre optionnel fillchar (un espace par défaut)
  qui définit le caractère de remplissage. Exemple : {{ 'ab'|center(6, '*') }}
  doit donner « **ab** ».
injection: []
tests_caches:
  - fichier: tests/test_forge_center.py
    contenu: |
      from jinja2 import Environment


      def test_center_fillchar():
          env = Environment()
          assert env.from_string("{{ 'ab'|center(6, '*') }}").render() == "**ab**"


      def test_center_par_defaut_inchange():
          env = Environment()
          assert env.from_string("{{ 'ab'|center(6) }}").render() == "  ab  "
solution:
  - fichier: src/jinja2/filters.py
    avant: |-
      def do_center(value: str, width: int = 80) -> str:
          """Centers the value in a field of a given width."""
          return soft_str(value).center(width)
    apres: |-
      def do_center(value: str, width: int = 80, fillchar: str = " ") -> str:
          """Centers the value in a field of a given width."""
          return soft_str(value).center(width, fillchar)
juge: [tests/test_forge_center.py, tests/test_filters.py]
