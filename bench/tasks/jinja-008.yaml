id: jinja-008
# À revoir : même sans ses tests, meta.py reste couvert à plus de 90 % par le reste
# de la suite, donc le juge réussit avant que l'agent travaille.
active: false
tests_modifiables: true   # la tâche consiste justement à écrire des tests
famille: ecriture_tests
depot: jinja
fichier_decisif: src/jinja2/meta.py
consigne: Le module src/jinja2/meta.py n'est plus couvert par les tests. Écris des tests pour atteindre
  au moins 90 % de couverture de ce module, sans modifier meta.py.
injection:
- fichier: tests/test_api.py
  avant: |+
    class TestMeta:
        def test_find_undeclared_variables(self, env):
            ast = env.parse("{% set foo = 42 %}{{ bar + foo }}")
            x = meta.find_undeclared_variables(ast)
            assert x == {"bar"}

            ast = env.parse(
                "{% set foo = 42 %}{{ bar + foo }}"
                "{% macro meh(x) %}{{ x }}{% endmacro %}"
                "{% for item in seq %}{{ muh(item) + meh(seq) }}"
                "{% endfor %}"
            )
            x = meta.find_undeclared_variables(ast)
            assert x == {"bar", "seq", "muh"}

            ast = env.parse("{% for x in range(5) %}{{ x }}{% endfor %}{{ foo }}")
            x = meta.find_undeclared_variables(ast)
            assert x == {"foo"}

        def test_find_refererenced_templates(self, env):
            ast = env.parse('{% extends "layout.html" %}{% include helper %}')
            i = meta.find_referenced_templates(ast)
            assert next(i) == "layout.html"
            assert next(i) is None
            assert list(i) == []

            ast = env.parse(
                '{% extends "layout.html" %}'
                '{% from "test.html" import a, b as c %}'
                '{% import "meh.html" as meh %}'
                '{% include "muh.html" %}'
            )
            i = meta.find_referenced_templates(ast)
            assert list(i) == ["layout.html", "test.html", "meh.html", "muh.html"]

        def test_find_included_templates(self, env):
            ast = env.parse('{% include ["foo.html", "bar.html"] %}')
            i = meta.find_referenced_templates(ast)
            assert list(i) == ["foo.html", "bar.html"]

            ast = env.parse('{% include ("foo.html", "bar.html") %}')
            i = meta.find_referenced_templates(ast)
            assert list(i) == ["foo.html", "bar.html"]

            ast = env.parse('{% include ["foo.html", "bar.html", foo] %}')
            i = meta.find_referenced_templates(ast)
            assert list(i) == ["foo.html", "bar.html", None]

            ast = env.parse('{% include ("foo.html", "bar.html", foo) %}')
            i = meta.find_referenced_templates(ast)
            assert list(i) == ["foo.html", "bar.html", None]


  apres: ''
solution:
- fichier: tests/test_api.py
  avant: 'class TestStreaming:'
